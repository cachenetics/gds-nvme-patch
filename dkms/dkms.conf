# dkms.conf TEMPLATE for gds-nvme-patch - NOT tested end-to-end via dkms.
#
# Why this is a template, not a working package: standard DKMS assumes the
# package's source is already vendored under /usr/src/<name>-<version>/ and
# just needs `make` run against your kernel headers. This project instead
# fetches the *exact* upstream drivers/nvme/host/{pci.c,core.c,nvme.h,
# fabrics.h,trace.h} for your running kernel's precise version at build time
# (see lib/build.sh:fetch_nvme_source) and patches it with lib/patch_nvme.py,
# which REFUSES on any anchor mismatch. DKMS's normal model has no hook for
# "go fetch source matching $kernelver first" - PRE_BUILD is the closest fit,
# and that is what this template uses.
#
# To actually wire this in you would:
#   1. Install this whole repo somewhere stable, e.g. /usr/src/gds-nvme-patch-1/
#      (dkms add -m gds-nvme-patch -v 1 expects sources at
#      /usr/src/<PACKAGE_NAME>-<PACKAGE_VERSION>/).
#   2. Have PRE_BUILD run scripts/dkms-prebuild.sh (not provided - write one
#      that calls fetch_nvme_source "$kernelver" "$dkms_tree/build" and
#      apply_nvme_patch, sourcing lib/build.sh; $kernelver is a dkms-provided
#      variable available inside PRE_BUILD).
#   3. Let MAKE build nvme.ko as normal via the Makefile in lib/build.sh's
#      write_build_makefile output.
#   4. Use POST_INSTALL to regenerate the initramfs (see lib/build.sh:
#      regen_initramfs) and, on ext4, reapply the rootflags=data=ordered
#      cmdline step (see lib/build.sh:set_cmdline_grub /
#      set_cmdline_systemd_boot) - both idempotent, safe to rerun on every
#      kernel update.
#
# What IS tested: the fetch/patch/build/install/initramfs/cmdline logic
# itself, driven by install.sh directly (see README.md - "Tested on exactly
# one configuration"). What is NOT tested: DKMS actually invoking any of it
# via the hooks below - this file is a documented starting point, not a
# verified rebuild-on-kernel-update pipeline. Until PRE_BUILD/POST_INSTALL
# scripts exist, the safe way to survive a kernel update is: rerun
# `sudo ./install.sh` after each kernel update (uninstall.sh first if you
# want a clean stock state beforehand).

PACKAGE_NAME="gds-nvme-patch"
PACKAGE_VERSION="1"

# BUILT_MODULE_NAME / DEST_MODULE_LOCATION describe what MAKE (below)
# produces and where dkms should install it - this matches the layout
# lib/build.sh's Makefile / install.sh already use directly.
BUILT_MODULE_NAME[0]="nvme"
BUILT_MODULE_LOCATION[0]="."
DEST_MODULE_LOCATION[0]="/kernel/drivers/nvme/host"

# This repo's Makefile (see lib/build.sh:write_build_makefile) already
# handles KDIR/ccflags; dkms just needs to invoke `make` in the source dir
# dkms stages for this kernel.
MAKE[0]="make -C \$kernel_source_dir M=\$dkms_tree/\$module/\$module_version/build"
CLEAN="make -C \$kernel_source_dir M=\$dkms_tree/\$module/\$module_version/build clean"

# Not written yet - see the numbered steps above. Left named/commented so the
# intent is explicit rather than silently absent.
# PRE_BUILD="scripts/dkms-prebuild.sh $kernelver $dkms_tree/$module/$module_version/build"
# POST_INSTALL="scripts/dkms-postinstall.sh $kernelver"

AUTOINSTALL="yes"
REMAKE_INITRD="no"  # we regenerate it ourselves (see regen_initramfs) once a
                     # PRE_BUILD/POST_INSTALL script exists to call it - dkms's
                     # own initrd remake does not know about the cmdline step.
